# Freya service-to-service policy for ipam: the gateway forwards browser traffic
# and probes health; the ipam.v1 gRPC surface (subnet/address/device/vlan/location/
# group/scan/system) is called by other modules directly. ipam calls auth, lcm,
# inventory (host reports, feature 020 — the allowing rule `ipam-hostsync` lives
# in inventory's policy) and warden as a client: warden.v1.Secrets/Get and
# /GetPassword for device BMC credentials, carrying the signed-in user's platform
# token (feature 024 — the allowing rule `ipam-bmc-secrets` lives in warden's
# policy). Active network operations (scan/ping/SNMP/IPMI/KVM) reach hosts on the
# lab network, NOT mesh peers. The scheduler (feature 026) calls
# scheduler.v1.TaskExecutor/ExecuteTask to run ipam's scheduled task types; ipam
# registers those types with the scheduler as a client (the allowing rule
# `modules-register` lives in the scheduler's policy).
version: ipam-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["ipam"]
    operations: ["*"]
    effect: allow
  - id: dns-ipam-sync
    # The dns module re-reads addresses (and their subnet prefix) named by
    # ipam.ip_address.* events before writing A/AAAA/PTR records (dns research D8).
    from: ["spiffe://example.org/svc/dns"]
    to: ["ipam"]
    operations: ["/ipam.v1.IpAddressService/Get", "/ipam.v1.IpAddressService/Find", "/ipam.v1.SubnetService/Get"]
    effect: allow
  - id: scheduler-execute
    # The scheduler runs ipam's task types (ipam:scan-network); the executor
    # server re-checks that the verified peer is the scheduler.
    from: ["spiffe://example.org/svc/scheduler"]
    to: ["ipam"]
    operations: ["/scheduler.v1.TaskExecutor/ExecuteTask"]
    effect: allow
