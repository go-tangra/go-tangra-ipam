# Freya service-to-service policy for ipam: the gateway forwards browser traffic
# and probes health; the ipam.v1 gRPC surface (subnet/address/device/vlan/location/
# group/scan/system) is called by other modules directly. ipam calls warden (secret
# refs), auth and lcm as a client. Active network operations (scan/ping/SNMP/IPMI/KVM)
# reach hosts on the lab network, NOT mesh peers.
version: ipam-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["ipam"]
    operations: ["*"]
    effect: allow
