openapi: 3.1.0
info:
  title: IPAM API
  version: 0.1.0
  description: >
    IP address management: subnets, IP addresses, managed devices (with
    interfaces, packages and out-of-band power/KVM), VLANs, locations, IP and
    host groups, active/async discovery scans, per-tenant DNS configuration,
    statistics, tenant backup and a realtime event stream. Gateway-proxied under
    /api/ipam. Every route declares an x-freya-permission (health is public).
    SNMP/BMC/IPMI credentials and sealed owner/contact fields are never returned
    in any response; devices expose only opaque warden secret refs and subnets
    only their effective SNMP state (write-only SNMP credentials, feature 021).
servers:
  - url: /
components:
  parameters:
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
    id:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-000000000001'
    ifid:
      name: ifid
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-0000000000bb'
    mid:
      name: mid
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      example: '018f3a2b-0000-7000-8000-0000000000cc'
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 64 }
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500 }
    force:
      name: force
      in: query
      required: false
      schema: { type: boolean }
    reportState:
      name: report_state
      in: query
      required: false
      schema: { type: string, enum: [reported, not_reported] }
  schemas:
    HostSyncSettings:
      type: object
      additionalProperties: false
      required: [enabled, full_interval_minutes, excluded_interfaces]
      properties:
        enabled: { type: boolean }
        full_interval_minutes: { type: integer, minimum: 15, maximum: 1440 }
        excluded_interfaces:
          type: array
          maxItems: 64
          items: { type: string, pattern: '^[A-Za-z0-9*?._:-]{1,64}$' }
        updated_by: { type: string, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    HostSyncStatus:
      type: object
      properties:
        enabled: { type: boolean }
        state: { type: string, enum: [ok, degraded, disabled] }
        last_error: { type: string, description: 'code only, e.g. inventory_unavailable' }
        last_poll_at: { type: string, format: date-time }
        last_reconcile_at: { type: string, format: date-time }
        next_reconcile_at: { type: string, format: date-time }
        hosts_reported: { type: integer }
        hosts_failed: { type: integer }
        devices_not_reported: { type: integer }
        addresses_in_conflict: { type: integer }
    HostSyncIssue:
      type: object
      properties:
        field: { type: string }
        reason: { type: string }
        count: { type: integer }
    DeviceHostSync:
      type: object
      properties:
        source: { type: string, enum: [manual, scan, host_report] }
        inventory_host_id: { type: string, format: uuid }
        report_state: { type: string, enum: ['', reported, not_reported] }
        snapshot_id: { type: string }
        collected_at: { type: string, format: date-time }
        applied_at: { type: string, format: date-time }
        trigger: { type: string }
        changes: { type: integer }
        issues: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/HostSyncIssue' } }
    ResyncResult:
      type: object
      properties:
        applied: { type: boolean }
        changes: { type: integer }
        issues: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/HostSyncIssue' } }
    HypervisorGuest:
      type: object
      properties:
        guest_ref: { type: string }
        name: { type: string }
        kind: { type: string, enum: [vm, container] }
        platform: { type: string }
        macs: { type: array, items: { type: string } }
        guest_device_id: { type: string, format: uuid }
        guest_device_name: { type: string }
        last_reported_at: { type: string, format: date-time }

    # ---- Subnet SNMP credentials (feature 021): write-only ----
    SubnetSNMPInput:
      type: object
      additionalProperties: false
      description: >
        Set or replace a subnet's own SNMP credentials. Every field of the
        chosen kind is required (v2c: community; v3: user, security_level,
        auth_protocol, auth_password and, for authPriv, priv_protocol and
        priv_password). Values are sealed at rest and never returned.
      required: [version]
      properties:
        version: { type: integer, enum: [2, 3] }
        community: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
        user: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
        security_level: { type: string, enum: [authNoPriv, authPriv] }
        auth_protocol: { type: string, enum: [MD5, SHA, SHA224, SHA256, SHA384, SHA512], description: 'MD5 and SHA (SHA-1) are weak' }
        auth_password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
        priv_protocol: { type: string, enum: [DES, AES, AES192, AES256, AES192C, AES256C], description: 'DES is weak; AES is AES-128; the C variants use Cisco (Reeder) key localisation' }
        priv_password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
    SNMPSummary:
      type: object
      description: Effective SNMP state of a subnet (own, inherited from the nearest ancestor, or none). Never a credential value.
      properties:
        state: { type: string, enum: [none, own, inherited] }
        version: { type: integer, enum: [2, 3] }
        security_level: { type: string, enum: [authNoPriv, authPriv] }
        weak: { type: boolean }
        source_subnet_id: { type: string }
        source_name: { type: string }
        source_cidr: { type: string }
    SubnetSNMPOwn:
      type: object
      properties:
        version: { type: integer, enum: [2, 3] }
        security_level: { type: string, enum: [authNoPriv, authPriv] }
        auth_protocol: { type: string }
        priv_protocol: { type: string }
        weak: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    SNMPTestInput:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { type: string, maxLength: 45, description: 'a usable IP address inside the subnet' }
    SNMPTestResult:
      type: object
      properties:
        outcome: { type: string, enum: [ok, no_response, auth_failed, unknown_user, privacy_failed, no_credentials, credentials_unreadable, error] }
        sys_name: { type: string, maxLength: 1024 }
        sys_descr: { type: string, maxLength: 1024 }
        detail: { type: string, maxLength: 1024, description: 'scrubbed reason when outcome is error' }
        source_subnet_id: { type: string }
        duration_ms: { type: integer }
    SubnetSNMPStatus:
      type: object
      properties:
        own: { oneOf: [{ $ref: '#/components/schemas/SubnetSNMPOwn' }, { type: 'null' }] }
        effective: { $ref: '#/components/schemas/SNMPSummary' }

    # ---- ARP-based MAC linking (feature 022) ----
    IPAddress:
      type: object
      description: >
        An IP address. mac_source, mac_source_device_id, mac_seen_at,
        mac_conflict, origin and link are server-owned (ignored in request
        bodies): a MAC set through the API is "manual", the host sync writes
        "agent", scans with SNMP learn "arp" from router ARP tables and never
        overwrite an agent or manual MAC (a disagreement is mac_conflict).
      properties:
        id: { type: string }
        address: { type: string }
        subnet_id: { type: string }
        hostname: { type: string }
        mac_address: { type: string }
        description: { type: string }
        device_id: { type: string }
        interface_name: { type: string }
        status: { type: string, enum: [active, reserved, dhcp, deprecated, offline] }
        address_type: { type: string }
        last_seen: { type: string, format: date-time }
        report_state: { type: string, enum: ['', reported, not_reported] }
        conflict: { type: boolean }
        mac_source: { type: string, enum: ['', manual, agent, arp], readOnly: true }
        mac_source_device_id: { type: string, readOnly: true, description: 'device whose ARP table reported the MAC (arp)' }
        mac_seen_at: { type: string, format: date-time, readOnly: true }
        mac_conflict: { type: string, readOnly: true, description: 'ARP-observed MAC disagreeing with an agent/manual MAC' }
        origin: { type: string, enum: ['', arp], readOnly: true }
        link: { $ref: '#/components/schemas/AddressLink' }
        links:
          type: array
          readOnly: true
          maxItems: 256
          description: 'per-switch links, primary first: a host bonded across a switch pair (MLAG / LACP) has one per switch; link is the primary'
          items: { $ref: '#/components/schemas/HostSwitchLink' }
    HostSwitchLink:
      type: object
      readOnly: true
      description: >
        One per-switch link of a host interface or an address: on that switch
        the most direct port that learned the MAC (fewest MACs) or whose LLDP
        neighbour names the host. primary marks the link mirrored into the
        flat link fields.
      required: [switch_id, port_id, source, primary]
      properties:
        switch_id: { type: string }
        switch_name: { type: string }
        port_id: { type: string }
        port_name: { type: string }
        vlan: { type: integer }
        source: { type: string, enum: [snmp_fdb, lldp] }
        last_seen: { type: string, format: date-time }
        primary: { type: boolean }
    AddressLink:
      type: object
      readOnly: true
      description: 'switch port the address is connected to (inferred from switch forwarding tables / LLDP)'
      properties:
        switch_id: { type: string }
        switch_name: { type: string }
        port_id: { type: string }
        port_name: { type: string }
        vlan: { type: integer }
        source: { type: string, enum: [snmp_fdb, lldp] }
        last_seen: { type: string, format: date-time }
    BehindAddress:
      type: object
      properties:
        address_id: { type: string }
        address: { type: string }
        hostname: { type: string }
    DeviceInterface:
      type: object
      properties:
        id: { type: string }
        device_id: { type: string }
        name: { type: string }
        mac_address: { type: string }
        remote_device_id: { type: string }
        remote_device_name: { type: string }
        remote_interface_id: { type: string }
        remote_port_name: { type: string }
        link_source: { type: string }
        link_vlan: { type: integer }
        link_last_seen: { type: string, format: date-time }
        behind_device_id: { type: string }
        behind_device_name: { type: string }
        behind_addresses:
          type: array
          maxItems: 256
          description: 'addresses linked to this switch port as primary or per-switch link (feature 022)'
          items: { $ref: '#/components/schemas/BehindAddress' }
        links:
          type: array
          readOnly: true
          maxItems: 256
          description: 'per-switch links of a host interface, primary first (the flat remote_* / link_* fields are the primary)'
          items: { $ref: '#/components/schemas/HostSwitchLink' }
    ARPSettingsInput:
      type: object
      additionalProperties: false
      description: >
        Per-tenant ARP collection (feature 022): scans with SNMP discovery read
        the ARP/neighbour tables of the devices that answer unless disabled;
        excluded devices are never used as ARP sources; a MAC answering for
        more than proxy_threshold IPs in one scan is treated as proxy ARP.
      required: [enabled, excluded_devices, proxy_threshold]
      properties:
        enabled: { type: boolean }
        excluded_devices:
          type: array
          maxItems: 256
          description: 'ids of existing devices of the tenant'
          items: { type: string, format: uuid }
        proxy_threshold: { type: integer, minimum: 2, maximum: 256 }
    ARPSettings:
      type: object
      properties:
        enabled: { type: boolean }
        excluded_devices: { type: array, items: { type: string } }
        proxy_threshold: { type: integer }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    IPAddressList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IPAddress' } }
    IPScanJob:
      type: object
      properties:
        id: { type: string }
        subnet_id: { type: string }
        status: { type: string, enum: [pending, scanning, completed, failed, cancelled] }
        progress: { type: integer }
        status_message: { type: string }
        alive_count: { type: integer }
        new_count: { type: integer }
        updated_count: { type: integer }
        snmp_status: { type: string, enum: ['', not_requested, no_live_hosts, no_credentials, credentials_unreadable, ran] }
        snmp_discovered_count: { type: integer }
        arp_status: { type: string, enum: ['', ran, disabled, failed], description: 'ARP phase of a scan with SNMP discovery' }
        arp_devices: { type: integer, description: 'devices whose ARP table returned entries' }
        arp_partial: { type: integer, description: 'devices whose ARP read was capped or interrupted' }
        arp_entries: { type: integer }
        arp_applied: { type: integer, description: 'addresses whose MAC was set or changed' }
        arp_created: { type: integer, description: 'addresses created from ARP (origin arp)' }
        arp_conflicts: { type: integer }
        arp_ignored:
          type: object
          description: 'ignored entries by reason'
          additionalProperties: { type: integer }
          properties:
            invalid: { type: integer }
            multicast: { type: integer }
            virtual_router: { type: integer }
            network_device: { type: integer }
            proxy_arp: { type: integer }
            outside_subnets: { type: integer }
            excluded_device: { type: integer }
    IPScanJobList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IPScanJob' } }

    Error:
      type: object
      properties:
        reason: { type: string }
        detail: { type: object }
      example:
        reason: not_found
        detail: {}
paths:
  # ---- Subnets ----
  /api/ipam/v1/subnets:
    get: { operationId: listSubnets, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }], responses: { '200': { description: list } } }
    post: { operationId: createSubnet, x-freya-permission: 'subnets:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/subnets/tree:
    get: { operationId: getSubnetTree, x-freya-permission: 'ipam:read', responses: { '200': { description: tree } } }
  /api/ipam/v1/subnets/{id}:
    get: { operationId: getSubnet, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: subnet }, '404': { description: not_found } } }
    put: { operationId: updateSubnet, x-freya-permission: 'subnets:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteSubnet, x-freya-permission: 'subnets:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/force' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/subnets/{id}/stats:
    get: { operationId: getSubnetStats, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: stats } } }
  /api/ipam/v1/subnets/{id}/split:
    post: { operationId: splitSubnet, x-freya-permission: 'subnets:manage', x-freya-max-body-bytes: 4096, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: 'created children and skipped blocks' }, '400': { description: validation_failed } } }
  /api/ipam/v1/subnets/{id}/snmp:
    get:
      operationId: getSubnetSnmp
      x-freya-permission: 'ipam:read'
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'own and effective SNMP credential status (never values)', content: { application/json: { schema: { $ref: '#/components/schemas/SubnetSNMPStatus' } } } }
        '404': { description: not_found }
    put:
      operationId: setSubnetSnmp
      x-freya-permission: 'subnets:manage'
      x-freya-max-body-bytes: 4096
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubnetSNMPInput' } } } }
      responses:
        '200': { description: 'credentials set or replaced (status, never values)', content: { application/json: { schema: { $ref: '#/components/schemas/SubnetSNMPStatus' } } } }
        '404': { description: not_found }
        '422': { description: 'validation_failed (detail.field names the field)' }
    delete:
      operationId: clearSubnetSnmp
      x-freya-permission: 'subnets:manage'
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      responses:
        '204': { description: 'own credentials deleted (no-op when the subnet has none); the subnet inherits again or has none' }
        '404': { description: not_found }
  /api/ipam/v1/subnets/{id}/snmp/test:
    post:
      operationId: testSubnetSnmp
      x-freya-permission: 'scan:run'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SNMPTestInput' } } } }
      responses:
        '200': { description: 'test outcome with sysName/sysDescr on success (never credentials)', content: { application/json: { schema: { $ref: '#/components/schemas/SNMPTestResult' } } } }
        '404': { description: not_found }
        '422': { description: 'validation_failed (detail.field = address: not a usable address of the subnet)' }
        '429': { description: 'rate_limited (more than 10 tests per user per minute)' }
  /api/ipam/v1/subnets/{id}/scan:
    post: { operationId: scanSubnet, x-freya-permission: 'scan:run', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: 'synchronous discovery result' } } }

  # ---- IP addresses ----
  /api/ipam/v1/ip-addresses:
    get:
      operationId: listIpAddresses
      x-freya-permission: 'ipam:read'
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/reportState' }
        - { name: conflict, in: query, required: false, schema: { type: boolean } }
        - { name: mac, in: query, required: false, description: 'full or partial MAC in any notation (colon, dash, dot, none): 2-12 hex digits after separators are dropped; invalid is 422 validation_failed with detail.field = mac', schema: { type: string, maxLength: 64 } }
      responses:
        '200': { description: list, content: { application/json: { schema: { $ref: '#/components/schemas/IPAddressList' } } } }
        '422': { description: 'validation_failed (detail.field = mac)' }
    post: { operationId: createIpAddress, x-freya-permission: 'addresses:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/ip-addresses/allocate:
    post: { operationId: allocateIpAddress, x-freya-permission: 'addresses:allocate', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: 'next-free allocated' } } }
  /api/ipam/v1/ip-addresses/bulk-allocate:
    post: { operationId: bulkAllocateIpAddresses, x-freya-permission: 'addresses:allocate', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: 'bulk allocated' } } }
  /api/ipam/v1/ip-addresses/find:
    get:
      operationId: findIpAddress
      x-freya-permission: 'ipam:read'
      parameters:
        - { name: address, in: query, required: true, schema: { type: string, maxLength: 64 } }
      responses: { '200': { description: found }, '404': { description: not_found } }
  /api/ipam/v1/ip-addresses/suggest:
    get:
      operationId: suggestIpAddresses
      x-freya-permission: 'ipam:read'
      parameters:
        - { name: subnet_id, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: count, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 256 } }
      responses: { '200': { description: 'ICMP+TCP verified free addresses' } }
  /api/ipam/v1/ip-addresses/{id}:
    get: { operationId: getIpAddress, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: address, content: { application/json: { schema: { $ref: '#/components/schemas/IPAddress' } } } }, '404': { description: not_found } } }
    put: { operationId: updateIpAddress, x-freya-permission: 'addresses:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteIpAddress, x-freya-permission: 'addresses:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/ip-addresses/{id}/clear-conflict:
    post:
      operationId: clearIpAddressConflict
      x-freya-permission: 'addresses:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'address with the conflict flag cleared' }, '404': { description: not_found } }
  /api/ipam/v1/ip-addresses/{id}/ping:
    post: { operationId: pingIpAddress, x-freya-permission: 'scan:run', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: 'reachability result' } } }

  # ---- Devices ----
  /api/ipam/v1/devices:
    get:
      operationId: listDevices
      x-freya-permission: 'ipam:read'
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/reportState' }
        - { name: source, in: query, required: false, schema: { type: string, enum: [manual, scan, host_report] } }
      responses: { '200': { description: list } }
    post: { operationId: createDevice, x-freya-permission: 'devices:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/devices/{id}:
    get: { operationId: getDevice, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: device }, '404': { description: not_found } } }
    put: { operationId: updateDevice, x-freya-permission: 'devices:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteDevice, x-freya-permission: 'devices:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/force' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/devices/{id}/addresses:
    get: { operationId: getDeviceAddresses, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'addresses (with their links)', content: { application/json: { schema: { $ref: '#/components/schemas/IPAddressList' } } } } } }
  /api/ipam/v1/devices/{id}/interfaces:
    get: { operationId: getDeviceInterfaces, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'interfaces (switch ports list the addresses behind them)', content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DeviceInterface' } } } } } } } } }
    post: { operationId: createDeviceInterface, x-freya-permission: 'devices:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: created } } }
  /api/ipam/v1/devices/{id}/interfaces/{ifid}:
    delete: { operationId: deleteDeviceInterface, x-freya-permission: 'devices:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/ifid' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/devices/{id}/packages:
    get: { operationId: listDevicePackages, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: packages } } }
  /api/ipam/v1/devices/{id}/packages/sync:
    post: { operationId: syncDevicePackages, x-freya-permission: 'devices:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: synced } } }
  /api/ipam/v1/devices/{id}/host-groups:
    get: { operationId: getDeviceHostGroups, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'host groups for device' } } }
  /api/ipam/v1/devices/{id}/power:
    get: { operationId: getDevicePower, x-freya-permission: 'power:control', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'power status' } } }
    post: { operationId: setDevicePower, x-freya-permission: 'power:control', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: 'power action accepted' } } }
  /api/ipam/v1/devices/{id}/sensors:
    get: { operationId: getDeviceSensors, x-freya-permission: 'power:control', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: sensors } } }
  /api/ipam/v1/devices/{id}/sel:
    get: { operationId: getDeviceSel, x-freya-permission: 'power:control', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'system event log' } } }
  /api/ipam/v1/devices/{id}/host-sync:
    get:
      operationId: getDeviceHostSync
      x-freya-permission: 'ipam:read'
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'report source, last report and issues', content: { application/json: { schema: { $ref: '#/components/schemas/DeviceHostSync' } } } }
        '404': { description: not_found }
    post:
      operationId: resyncDeviceHostSync
      x-freya-permission: 'devices:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: 'latest report applied', content: { application/json: { schema: { $ref: '#/components/schemas/ResyncResult' } } } }
        '409': { description: 'not_host_reported | host_sync_disabled' }
        '503': { description: temporarily_unavailable }
  /api/ipam/v1/devices/{id}/guests:
    get:
      operationId: listDeviceGuests
      x-freya-permission: 'ipam:read'
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { description: 'guests reported by a hypervisor (matched and unmatched)' } }
  /api/ipam/v1/devices/{id}/kvm-session:
    post: { operationId: startDeviceKvmSession, x-freya-permission: 'kvm:access', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: 'kvm session token + console url' } } }

  # ---- Host sync (feature 020) ----
  /api/ipam/v1/host-sync/settings:
    get:
      operationId: getHostSyncSettings
      x-freya-permission: 'ipam:read'
      responses: { '200': { description: settings, content: { application/json: { schema: { $ref: '#/components/schemas/HostSyncSettings' } } } } }
    put:
      operationId: updateHostSyncSettings
      x-freya-permission: 'hostsync:manage'
      x-freya-max-body-bytes: 16384
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HostSyncSettings' } } } }
      responses: { '200': { description: settings }, '400': { description: validation } }
  /api/ipam/v1/host-sync/status:
    get:
      operationId: getHostSyncStatus
      x-freya-permission: 'ipam:read'
      responses: { '200': { description: status, content: { application/json: { schema: { $ref: '#/components/schemas/HostSyncStatus' } } } } }
  /api/ipam/v1/host-sync/resync:
    post:
      operationId: resyncAllHosts
      x-freya-permission: 'devices:manage'
      x-freya-max-body-bytes: 1024
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      responses: { '202': { description: 'full reconcile scheduled' }, '409': { description: host_sync_disabled } }

  # ---- ARP-based MAC linking (feature 022) ----
  /api/ipam/v1/arp/settings:
    get:
      operationId: getArpSettings
      x-freya-permission: 'ipam:read'
      responses: { '200': { description: 'settings (defaults when never saved)', content: { application/json: { schema: { $ref: '#/components/schemas/ARPSettings' } } } } }
    put:
      operationId: updateArpSettings
      x-freya-permission: 'subnets:manage'
      x-freya-max-body-bytes: 16384
      parameters: [{ $ref: '#/components/parameters/csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ARPSettingsInput' } } } }
      responses:
        '200': { description: settings, content: { application/json: { schema: { $ref: '#/components/schemas/ARPSettings' } } } }
        '422': { description: 'validation_failed (detail.field names the field)' }

  # ---- Warden secret references (metadata only) ----
  /api/ipam/v1/warden-secrets:
    get: { operationId: listWardenSecrets, x-freya-permission: 'ipam:read', responses: { '200': { description: 'secret metadata (no values)' } } }
  /api/ipam/v1/warden-secrets/{id}:
    get: { operationId: getWardenSecret, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: 'secret metadata (no values)' }, '404': { description: not_found } } }

  # ---- VLANs ----
  /api/ipam/v1/vlans:
    get: { operationId: listVlans, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }], responses: { '200': { description: list } } }
    post: { operationId: createVlan, x-freya-permission: 'vlans:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/vlans/{id}:
    get: { operationId: getVlan, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: vlan }, '404': { description: not_found } } }
    put: { operationId: updateVlan, x-freya-permission: 'vlans:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteVlan, x-freya-permission: 'vlans:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/vlans/{id}/subnets:
    get: { operationId: getVlanSubnets, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: subnets } } }

  # ---- Locations ----
  /api/ipam/v1/locations:
    get: { operationId: listLocations, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }], responses: { '200': { description: list } } }
    post: { operationId: createLocation, x-freya-permission: 'locations:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/locations/tree:
    get: { operationId: getLocationTree, x-freya-permission: 'ipam:read', responses: { '200': { description: tree } } }
  /api/ipam/v1/locations/{id}:
    get: { operationId: getLocation, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: location }, '404': { description: not_found } } }
    put: { operationId: updateLocation, x-freya-permission: 'locations:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteLocation, x-freya-permission: 'locations:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/force' }], responses: { '204': { description: deleted } } }

  # ---- IP groups ----
  /api/ipam/v1/ip-groups:
    get: { operationId: listIpGroups, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }], responses: { '200': { description: list } } }
    post: { operationId: createIpGroup, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/ip-groups/check:
    get:
      operationId: checkIpInGroup
      x-freya-permission: 'ipam:read'
      parameters:
        - { name: ip, in: query, required: true, schema: { type: string, maxLength: 64 } }
      responses: { '200': { description: 'groups containing ip' } }
  /api/ipam/v1/ip-groups/{id}:
    get: { operationId: getIpGroup, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: group }, '404': { description: not_found } } }
    put: { operationId: updateIpGroup, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteIpGroup, x-freya-permission: 'groups:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/ip-groups/{id}/members:
    get: { operationId: listIpGroupMembers, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: members } } }
    post: { operationId: addIpGroupMember, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: added } } }
  /api/ipam/v1/ip-groups/{id}/members/{mid}:
    put: { operationId: updateIpGroupMember, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/mid' }], responses: { '200': { description: updated } } }
    delete: { operationId: removeIpGroupMember, x-freya-permission: 'groups:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/mid' }], responses: { '204': { description: removed } } }

  # ---- Host groups ----
  /api/ipam/v1/host-groups:
    get: { operationId: listHostGroups, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }], responses: { '200': { description: list } } }
    post: { operationId: createHostGroup, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '201': { description: created } } }
  /api/ipam/v1/host-groups/{id}:
    get: { operationId: getHostGroup, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: group }, '404': { description: not_found } } }
    put: { operationId: updateHostGroup, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: updated } } }
    delete: { operationId: deleteHostGroup, x-freya-permission: 'groups:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '204': { description: deleted } } }
  /api/ipam/v1/host-groups/{id}/members:
    get: { operationId: listHostGroupMembers, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: members } } }
    post: { operationId: addHostGroupMember, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '201': { description: added } } }
  /api/ipam/v1/host-groups/{id}/members/{mid}:
    put: { operationId: updateHostGroupMember, x-freya-permission: 'groups:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/mid' }], responses: { '200': { description: updated } } }
    delete: { operationId: removeHostGroupMember, x-freya-permission: 'groups:manage', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/mid' }], responses: { '204': { description: removed } } }

  # ---- Scans ----
  /api/ipam/v1/ip-scans:
    get: { operationId: listIpScans, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' }], responses: { '200': { description: list, content: { application/json: { schema: { $ref: '#/components/schemas/IPScanJobList' } } } } } }
    post: { operationId: startIpScan, x-freya-permission: 'scan:run', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '202': { description: 'scan started' } } }
  /api/ipam/v1/ip-scans/{id}:
    get: { operationId: getIpScan, x-freya-permission: 'ipam:read', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { description: job, content: { application/json: { schema: { $ref: '#/components/schemas/IPScanJob' } } } }, '404': { description: not_found } } }
  /api/ipam/v1/ip-scans/{id}/cancel:
    post: { operationId: cancelIpScan, x-freya-permission: 'scan:run', parameters: [{ $ref: '#/components/parameters/csrf' }, { $ref: '#/components/parameters/id' }], responses: { '200': { description: cancelled } } }

  # ---- System ----
  /api/ipam/v1/health:
    get: { operationId: health, x-freya-public: true, responses: { '200': { description: 'health (public)' } } }
  /api/ipam/v1/stats:
    get: { operationId: getStats, x-freya-permission: 'ipam:read', responses: { '200': { description: 'tenant statistics' } } }
  /api/ipam/v1/dns-config:
    get: { operationId: getDnsConfig, x-freya-permission: 'ipam:read', responses: { '200': { description: 'dns config' } } }
    put: { operationId: updateDnsConfig, x-freya-permission: 'dns:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: updated } } }
  /api/ipam/v1/dns-config/test:
    post: { operationId: testDnsConfig, x-freya-permission: 'dns:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: 'dns test result' } } }

  # ---- Backup ----
  /api/ipam/v1/backup/export:
    post: { operationId: exportBackup, x-freya-permission: 'backup:manage', x-freya-max-body-bytes: 65536, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: export } } }
  /api/ipam/v1/backup/import:
    post: { operationId: importBackup, x-freya-permission: 'backup:manage', x-freya-max-body-bytes: 268435456, parameters: [{ $ref: '#/components/parameters/csrf' }], responses: { '200': { description: imported } } }

  # ---- Realtime (SSE; no x-freya-timeout-seconds so it stays within the
  #      gateway's 5m MaxDurationRoute) ----
  /api/ipam/v1/stream:
    get: { operationId: streamEvents, x-freya-permission: 'ipam:read', responses: { '200': { description: 'SSE event stream (address/scan events)' } } }
