}
message LocationTreeNode {
  Location location = 1;
  repeated LocationTreeNode children = 2;
}
message LocationTree {
  repeated LocationTreeNode roots = 1;
}

// ---- IpGroupService ----

// IpGroupService administers IP groups and their members.
service IpGroupService {
  rpc Create(CreateIpGroupRequest) returns (IPGroup);
  rpc Get(GetIpGroupRequest) returns (IPGroup);
  rpc List(ListIpGroupsRequest) returns (ListIpGroupsResponse);
  rpc Update(UpdateIpGroupRequest) returns (IPGroup);
  rpc Delete(DeleteIpGroupRequest) returns (DeleteResponse);
  rpc AddMember(AddIpGroupMemberRequest) returns (IPGroupMember);
  rpc UpdateMember(UpdateIpGroupMemberRequest) returns (IPGroupMember);
  rpc RemoveMember(RemoveIpGroupMemberRequest) returns (DeleteResponse);
  rpc ListMembers(ListIpGroupMembersRequest) returns (ListIpGroupMembersResponse);
  rpc CheckIpInGroup(CheckIpInGroupRequest) returns (CheckIpInGroupResponse);
}

message CreateIpGroupRequest {
  string tenant_id = 1;
  IPGroup group = 2;
}
message GetIpGroupRequest {
  string tenant_id = 1;
  string id = 2;
  bool include_members = 3;
}
message ListIpGroupsRequest {
  string tenant_id = 1;
  bool include_members = 2;
  int64 limit = 3;
  string cursor_id = 4;
}
message ListIpGroupsResponse {
  repeated IPGroup groups = 1;
  string next_cursor_id = 2;
}
message UpdateIpGroupRequest {
  string tenant_id = 1;
  string id = 2;
  IPGroup group = 3;
}
message DeleteIpGroupRequest {
  string tenant_id = 1;
  string id = 2;
}
message AddIpGroupMemberRequest {
  string tenant_id = 1;
  string ip_group_id = 2;
  IPGroupMember member = 3;
}
message UpdateIpGroupMemberRequest {
  string tenant_id = 1;
  string ip_group_id = 2;
  string member_id = 3;
  IPGroupMember member = 4;
}
message RemoveIpGroupMemberRequest {
  string tenant_id = 1;
  string ip_group_id = 2;
  string member_id = 3;
}
message ListIpGroupMembersRequest {
  string tenant_id = 1;
  string ip_group_id = 2;
}
message ListIpGroupMembersResponse {
  repeated IPGroupMember members = 1;
}
message CheckIpInGroupRequest {
  string tenant_id = 1;
  string ip = 2;
}
message CheckIpInGroupResponse {
  repeated IPGroup groups = 1; // groups the ip belongs to
}

// ---- HostGroupService ----

// HostGroupService administers host groups and their device members.
service HostGroupService {
  rpc Create(CreateHostGroupRequest) returns (HostGroup);
  rpc Get(GetHostGroupRequest) returns (HostGroup);
  rpc List(ListHostGroupsRequest) returns (ListHostGroupsResponse);
  rpc Update(UpdateHostGroupRequest) returns (HostGroup);
  rpc Delete(DeleteHostGroupRequest) returns (DeleteResponse);
  rpc AddMember(AddHostGroupMemberRequest) returns (HostGroupMember);
  rpc RemoveMember(RemoveHostGroupMemberRequest) returns (DeleteResponse);
  rpc ListMembers(ListHostGroupMembersRequest) returns (ListHostGroupMembersResponse);
  rpc ListDeviceHostGroups(ListDeviceHostGroupsRequest) returns (ListHostGroupsResponse);
}

message CreateHostGroupRequest {
  string tenant_id = 1;
  HostGroup group = 2;
}
message GetHostGroupRequest {
  string tenant_id = 1;
  string id = 2;
  bool include_members = 3;
}
message ListHostGroupsRequest {
  string tenant_id = 1;
  bool include_members = 2;
  int64 limit = 3;
  string cursor_id = 4;
}
message ListHostGroupsResponse {
  repeated HostGroup groups = 1;
  string next_cursor_id = 2;
}
message UpdateHostGroupRequest {
  string tenant_id = 1;
  string id = 2;
  HostGroup group = 3;
}
message DeleteHostGroupRequest {
  string tenant_id = 1;
  string id = 2;
}
message AddHostGroupMemberRequest {
  string tenant_id = 1;
  string host_group_id = 2;
  string device_id = 3;
  int32 sequence = 4;
}
message RemoveHostGroupMemberRequest {
  string tenant_id = 1;
  string host_group_id = 2;
  string device_id = 3;
}
message ListHostGroupMembersRequest {
  string tenant_id = 1;
  string host_group_id = 2;
}
message ListHostGroupMembersResponse {
  repeated HostGroupMember members = 1;
}
message ListDeviceHostGroupsRequest {
  string tenant_id = 1;
  string device_id = 2;
}

// ---- IpScanService ----

// IpScanService starts and tracks async discovery jobs.
service IpScanService {
  rpc Start(StartScanRequest) returns (IPScanJob);
  rpc Get(GetScanRequest) returns (IPScanJob);
  rpc List(ListScansRequest) returns (ListScansResponse);
  rpc Cancel(CancelScanRequest) returns (IPScanJob);
}

message StartScanRequest {
  string tenant_id = 1;
  string subnet_id = 2;
  bool enable_snmp = 3;
  bool enable_dns_update = 4;
  bool skip_reverse_dns = 5;
  string tcp_probe_ports = 6;
  int32 concurrency = 7;
  int32 timeout_ms = 8;
}
message GetScanRequest {
  string tenant_id = 1;
  string id = 2;
}
message ListScansRequest {
  string tenant_id = 1;
  string subnet_id = 2;
  ScanStatus status = 3;
  int64 limit = 4;
  string cursor_id = 5;
}
message ListScansResponse {
  repeated IPScanJob jobs = 1;
  string next_cursor_id = 2;
}
message CancelScanRequest {
  string tenant_id = 1;
  string id = 2;
}

// ---- SystemService ----

// SystemService reports health, rollups and per-tenant DNS configuration.
service SystemService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetStats(GetStatsRequest) returns (Stats);
  rpc GetDnsConfig(GetDnsConfigRequest) returns (DNSConfig);
  rpc UpdateDnsConfig(UpdateDnsConfigRequest) returns (DNSConfig);
}

message HealthRequest {}
message HealthResponse {
  string status = 1; // ok|degraded
}
message GetStatsRequest {
  string tenant_id = 1;
}
message GetDnsConfigRequest {
  string tenant_id = 1;
}
message UpdateDnsConfigRequest {
  string tenant_id = 1;
  DNSConfig config = 2;
}
