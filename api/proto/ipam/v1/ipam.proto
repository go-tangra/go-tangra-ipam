message CreateLocationRequest {
  string tenant_id = 1;
  Location location = 2;
}
message GetLocationRequest {
  string tenant_id = 1;
  string id = 2;
}
message ListLocationsRequest {
  string tenant_id = 1;
  string parent_id = 2;
  LocationType location_type = 3;
  string country = 4;
  LocationStatus status = 5;
  int64 limit = 6;
  string cursor_id = 7;
}
message ListLocationsResponse {
  repeated Location locations = 1;
  string next_cursor_id = 2;
}
message UpdateLocationRequest {
  string tenant_id = 1;
  string id = 2;
  Location location = 3;
}
message DeleteLocationRequest {
  string tenant_id = 1;
  string id = 2;
  bool force = 3;
}
message GetLocationTreeRequest {
